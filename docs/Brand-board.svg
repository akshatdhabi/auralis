<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050"><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}</style><linearGradient id="sun" x2="0" y2="1"><stop stop-color="#ffb15c"/><stop offset="1" stop-color="#eb729a"/></linearGradient></defs><rect width="1200" height="1050" fill="#eae5df"/><text x="54" y="68" font-size="13" fill="#675d56" letter-spacing="3">FOUR WAYS TO FEEL THE MUSIC</text><text x="52" y="126" font-size="43" fill="#171419" font-weight="300" letter-spacing="-2">A name. A mood. A bigger canvas.</text><g transform="translate(48 166)"><rect width="552" height="385" rx="20" fill="#0c0a0f"/><text x="30" y="36" font-size="9" fill="#ab78ff" letter-spacing="1.7">01 / EXPRESSIVE · CINEMATIC</text><ellipse cx="430" cy="130" rx="46.0" ry="34.0" fill="none" stroke="#ff5c3d" stroke-width="1.3" transform="rotate(-25 430 130)"/><ellipse cx="430" cy="130" rx="48.8" ry="36.3" fill="none" stroke="#ab78ff" stroke-width="1.3" transform="rotate(-20 430 130)"/><ellipse cx="430" cy="130" rx="51.6" ry="38.6" fill="none" stroke="#ff5c3d" stroke-width="1.3" transform="rotate(-15 430 130)"/><ellipse cx="430" cy="130" rx="54.4" ry="40.9" fill="none" stroke="#ab78ff" stroke-width="1.3" transform="rotate(-10 430 130)"/><ellipse cx="430" cy="130" rx="57.2" ry="43.2" fill="none" stroke="#ff5c3d" stroke-width="1.3" transform="rotate(-5 430 130)"/><ellipse cx="430" cy="130" rx="60.0" ry="45.5" fill="none" stroke="#ab78ff" stroke-width="1.3" transform="rotate(0 430 130)"/><ellipse cx="430" cy="130" rx="62.8" ry="47.8" fill="none" stroke="#ff5c3d" stroke-width="1.3" transform="rotate(5 430 130)"/><ellipse cx="430" cy="130" rx="65.6" ry="50.099999999999994" fill="none" stroke="#ab78ff" stroke-width="1.3" transform="rotate(10 430 130)"/><ellipse cx="430" cy="130" rx="68.4" ry="52.4" fill="none" stroke="#ff5c3d" stroke-width="1.3" transform="rotate(15 430 130)"/><ellipse cx="430" cy="130" rx="71.2" ry="54.7" fill="none" stroke="#ab78ff" stroke-width="1.3" transform="rotate(20 430 130)"/><ellipse cx="430" cy="130" rx="74.0" ry="57.0" fill="none" stroke="#ff5c3d" stroke-width="1.3" transform="rotate(25 430 130)"/><ellipse cx="430" cy="130" rx="76.8" ry="59.3" fill="none" stroke="#ab78ff" stroke-width="1.3" transform="rotate(30 430 130)"/><text x="29" y="230" font-size="56" fill="#f5f0e8" font-weight="300" letter-spacing="-2">auralis<tspan fill="#ff5c3d">.</tspan></text><text x="31" y="269" font-size="17" fill="#ab78ff">A bigger canvas for your music.</text><text x="31" y="304" font-size="11" fill="#a69fae">Interwoven motion. Warm light. Oversized type.</text><rect x="31" y="333" width="22" height="13" rx="3" fill="#0c0a0f" stroke="#ffffff" stroke-opacity=".2"/><rect x="62" y="333" width="22" height="13" rx="3" fill="#ff5c3d" stroke="#ffffff" stroke-opacity=".2"/><rect x="93" y="333" width="22" height="13" rx="3" fill="#ab78ff" stroke="#ffffff" stroke-opacity=".2"/><rect x="124" y="333" width="22" height="13" rx="3" fill="#f5f0e8" stroke="#ffffff" stroke-opacity=".2"/></g><g transform="translate(624 166)"><rect width="552" height="385" rx="20" fill="#11100f"/><text x="30" y="36" font-size="9" fill="#eee8dc" letter-spacing="1.7">02 / TYPOGRAPHIC · ARCHITECTURAL</text><path d="M363 171 V96 Q363 67 394 67 Q423 67 423 96 V171 M423 96 Q423 67 454 67 Q484 67 484 96 V171" fill="none" stroke="#ff6a22" stroke-width="13"/><text x="29" y="230" font-size="56" fill="#f5f0e8" font-weight="300" letter-spacing="-2">monogram<tspan fill="#ff6a22">.</tspan></text><text x="31" y="269" font-size="17" fill="#eee8dc">Make room for music.</text><text x="31" y="304" font-size="11" fill="#a69fae">A confident editorial frame for every record.</text><rect x="31" y="333" width="22" height="13" rx="3" fill="#11100f" stroke="#ffffff" stroke-opacity=".2"/><rect x="62" y="333" width="22" height="13" rx="3" fill="#ff6a22" stroke="#ffffff" stroke-opacity=".2"/><rect x="93" y="333" width="22" height="13" rx="3" fill="#eee8dc" stroke="#ffffff" stroke-opacity=".2"/><rect x="124" y="333" width="22" height="13" rx="3" fill="#f5f0e8" stroke="#ffffff" stroke-opacity=".2"/></g><g transform="translate(48 576)"><rect width="552" height="385" rx="20" fill="#0c1727"/><text x="30" y="36" font-size="9" fill="#eb729a" letter-spacing="1.7">03 / ATMOSPHERIC · LUMINOUS</text><circle cx="429" cy="124" r="59" fill="url(#sun)"/><path d="M337 147H520" stroke="#0c1727" stroke-width="8"/><path d="M337 159H520" stroke="#0c1727" stroke-width="9"/><path d="M337 173H520" stroke="#0c1727" stroke-width="10"/><text x="29" y="230" font-size="56" fill="#f5f0e8" font-weight="300" letter-spacing="-2">afterglow<tspan fill="#ffb15c">.</tspan></text><text x="31" y="269" font-size="17" fill="#eb729a">Stay in the feeling.</text><text x="31" y="304" font-size="11" fill="#a69fae">Long horizons, soft gradients, a little nostalgia.</text><rect x="31" y="333" width="22" height="13" rx="3" fill="#0c1727" stroke="#ffffff" stroke-opacity=".2"/><rect x="62" y="333" width="22" height="13" rx="3" fill="#ffb15c" stroke="#ffffff" stroke-opacity=".2"/><rect x="93" y="333" width="22" height="13" rx="3" fill="#eb729a" stroke="#ffffff" stroke-opacity=".2"/><rect x="124" y="333" width="22" height="13" rx="3" fill="#f5f0e8" stroke="#ffffff" stroke-opacity=".2"/></g><g transform="translate(624 576)"><rect width="552" height="385" rx="20" fill="#17191d"/><text x="30" y="36" font-size="9" fill="#d8dcdd" letter-spacing="1.7">04 / QUIET · TACTILE</text><path d="M357 69 L493 102 L452 181 L374 153 Z" fill="#c1b4e8" opacity=".3"/><path d="M380 65 L472 131 L408 181 Z" fill="#d8dcdd" opacity=".55"/><path d="M351 103 L469 75 L491 159 Z" fill="#c1b4e8" opacity=".4"/><text x="29" y="230" font-size="56" fill="#f5f0e8" font-weight="300" letter-spacing="-2">velum<tspan fill="#c1b4e8">.</tspan></text><text x="31" y="269" font-size="17" fill="#d8dcdd">Let the music unfold.</text><text x="31" y="304" font-size="11" fill="#a69fae">Translucent folds and a softer kind of precision.</text><rect x="31" y="333" width="22" height="13" rx="3" fill="#17191d" stroke="#ffffff" stroke-opacity=".2"/><rect x="62" y="333" width="22" height="13" rx="3" fill="#c1b4e8" stroke="#ffffff" stroke-opacity=".2"/><rect x="93" y="333" width="22" height="13" rx="3" fill="#d8dcdd" stroke="#ffffff" stroke-opacity=".2"/><rect x="124" y="333" width="22" height="13" rx="3" fill="#f5f0e8" stroke="#ffffff" stroke-opacity=".2"/></g><text x="52" y="1030" font-size="11" fill="#776e67">Creative directions · Auralis is the working identity · Names require availability and trademark review</text></svg>